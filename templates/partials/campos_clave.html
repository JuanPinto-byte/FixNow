{# Contraseña + confirmación con la política de FN-1 / FN-8 #}
<div class="mb-3">
  <label class="form-label" for="password">Contraseña</label>
  <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
  <ul class="fx-checklist" aria-live="polite">
    <li data-regla="largo">Mínimo 8 caracteres</li>
    <li data-regla="mayus">Una mayúscula</li>
    <li data-regla="numero">Un número</li>
    <li data-regla="simbolo">Un símbolo (por ejemplo ! # $ %)</li>
  </ul>
</div>
<div class="mb-3">
  <label class="form-label" for="password2">Confirmar contraseña</label>
  <input class="form-control" type="password" id="password2" name="password2" autocomplete="new-password" required>
  <div class="invalid-feedback">Las contraseñas no coinciden.</div>
</div>
